name: Release

# A release is a tag that names the version in Directory.Build.props:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (for example v1.0.0-rc.2)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # A manual recovery uses the current workflow uploader but builds the
      # original tag's code. No existing tag is moved to pick up workflow fixes.
      - name: Preserve release uploader
        run: cp tools/publish-github-release.sh "$RUNNER_TEMP/janet-publish-github-release.sh"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: The tag must be the version of the code
        id: version
        run: |
          version=$(dotnet msbuild jaNETFramework/jaNETFramework.csproj -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "The tag is $RELEASE_TAG but Directory.Build.props says $version." >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version." >&2
            exit 1
          fi

      - name: Build and test
        run: |
          dotnet build jaNETFramework.sln -c Release
          dotnet test jaNETFramework.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Browser and build script tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          $tests = @(Get-ChildItem jaNETFramework.Tests/Web*Tests.mjs | Sort-Object Name | ForEach-Object { $_.FullName })
          node --test --test-concurrency=1 @tests tools/test-build-scripts.mjs tools/test-publish-scripts.mjs 2>&1 | Tee-Object -FilePath TestResults/browser-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: TestResults

      - name: Pack
        run: dotnet pack jaNETFramework.sln -c Release --no-build -o packages

      - name: Release notes from the changelog
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }' CHANGELOG.md > notes.md

      # runs without anything installed: linux-x64, linux-arm64, linux-arm, osx-arm64, osx-x64, win-x64, win-arm64
      - name: Programs for every system (self-contained)
        run: bash tools/publish.sh

      - name: Source archive
        run: git archive --format=zip --prefix=janet-framework-${{ steps.version.outputs.version }}/ -o janet-framework-${{ steps.version.outputs.version }}.zip HEAD

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash "$RUNNER_TEMP/janet-publish-github-release.sh" "$RELEASE_TAG" "${{ steps.version.outputs.version }}" notes.md \
            packages/*.nupkg packages/*.snupkg janet-framework-${{ steps.version.outputs.version }}.zip artifacts/*.tar.gz artifacts/*.zip

      # needs the repository secret NUGET_API_KEY; without it the packages are only attached to the release
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "NUGET_API_KEY is not set: not published to nuget.org."; exit 0; fi
          dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
