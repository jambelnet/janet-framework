name: CI

on:
  push:
    branches: [master, main, next, modern, 'modernize-*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Release: warnings are errors
      - name: Build
        run: dotnet build jaNETFramework.sln -c Release

      - name: Test
        run: dotnet test jaNETFramework.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Browser and build script tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem jaNETFramework.Tests/Web*Tests.mjs | Sort-Object Name | ForEach-Object { $_.FullName })
          node --test @tests tools/test-build-scripts.mjs tools/test-publish-scripts.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  # the program must still behave like the original: tools/compare.ps1 replays a recording of it (Windows PowerShell)
  replay:
    name: Behavior replay
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Replay
        shell: powershell
        run: ./tools/compare.ps1

  package:
    name: NuGet packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack jaNETFramework.sln -c Release -o packages

      # the release builds the programs for every system; do it here once so that a problem shows before a tag
      - name: Program for Linux (self-contained)
        run: bash tools/publish.sh linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*
