<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#00797a">
    <title>Jubito - Z-Wave</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/app.css">
    <style>
        .nav-bottom { position: fixed; inset: auto 0 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
        .btn[aria-pressed="true"] { color: var(--primary-contrast); background: var(--primary); }
        body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    </style>
</head>
<body>
    <header class="appbar">
        <a class="brand" href="index.html"><img src="images/logo.png" alt="" width="30" height="30">Jubito</a>
        <span class="spacer"></span>
        <a class="btn" href="index.html">Home</a>
    </header>
    <main>
        <section class="view" aria-label="Z-Wave devices">
            <h1>Z-Wave Devices</h1>
            <p class="empty" id="status">Loading...</p>
            <ul class="cards" id="devices"></ul>
        </section>
    </main>
    <div class="nav-bottom">
        <button type="button" class="btn" id="addBtn" aria-pressed="false">Inclusion</button>
        <button type="button" class="btn" id="removeBtn" aria-pressed="false">Exclusion</button>
        <button type="button" class="btn" id="refreshBtn">Refresh</button>
    </div>
    <script type="module" src="js/jubito.razberry.js"></script>
</body>
</html>
